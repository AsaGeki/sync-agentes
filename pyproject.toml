[project]
name = "sync-agentes"
version = "1.0.0"
description = "API local de sincronizacao entre agentes (IAs e humanos) trabalhando no mesmo projeto"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-dotenv>=1.2.3",
    "mcp>=2.1.1",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query()/Header() em default de argumento e o padrao idiomatico do FastAPI, nao um bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
