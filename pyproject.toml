[tool.uv.workspace]
members = ["client", "server"]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["server", "client/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query()/Header()/Form()/Path() em default de argumento é o padrão idiomático do FastAPI, não um bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Form", "fastapi.Path"]
