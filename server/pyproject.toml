[project]
name = "sync-agents-server"
version = "3.3.0"
description = "Servidor do sync-agents: API REST, interface web e trilha de eventos"
requires-python = ">=3.13"
dependencies = [
    "sync-agents-mcp",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-dotenv>=1.2.3",
    "psutil>=7.2.2",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "markdown-it-py>=4.2.0",
]

[tool.uv.sources]
sync-agents-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
