[project]
name = "sync-agents-mcp"
version = "0.1.0"
description = "Bridge MCP local do sync-agents: liga a IA de quem conecta ao canal de alinhamento, escopado pelo repositório git"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.1.1",
]

[project.urls]
Repository = "https://github.com/AsaGeki/sync-agentes"

[project.scripts]
sync-agents-mcp = "sync_agents_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_agents_mcp"]
